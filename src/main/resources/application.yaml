spring:
  application:
    name: cirquo-server

  datasource:
    url: jdbc:postgresql://localhost:5432/cirquo_db
    username: ${DB_USERNAME:postgre}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080