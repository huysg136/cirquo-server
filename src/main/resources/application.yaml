spring:
  application:
    name: cirquo-server

  datasource:
    url: jdbc:postgresql://localhost:5432/cirquo_db
    username: ${DB_USERNAME:postgre}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080